[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-mmm-demo"
version = "0.1.0"
description = "Reproducible synthetic Meridian marketing mix model and client report"
requires-python = ">=3.11,<3.13"
dependencies = ["google-meridian==2.0.0", "jinja2==3.1.6"]

[project.scripts]
meridian-demo = "meridian_demo.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meridian_demo = ["*.j2"]
